name: pray_times
description: "تطبيق مواقيت الصلاة — Offline-first بتقنية الحساب الفلكي المحلي (أم القرى)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # الحساب الفلكي المحلي (يعمل بدون إنترنت 100%)
  adhan_dart: ^1.2.0
  # المناطق الزمنية IANA (حساب الوقت المحلي لكل مدينة)
  timezone: ^0.11.1
  # إدارة الحالة
  provider: ^6.1.2
  # التخزين المحلي للإعدادات
  shared_preferences: ^2.2.3
  # دعم التوطين الرسمي من Flutter
  flutter_localizations:
    sdk: flutter
  # أيقونات إضافية
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/cities.json
    - assets/fonts/
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
